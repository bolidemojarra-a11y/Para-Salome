<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Salomé ❤️</title>

    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <div class="desk">

        <!-- Telaraña de Spiderman -->
        <div class="spider-web">🕸️</div>

        <!-- Decoraciones Temáticas de Salomé -->
        <div class="spiderman-badge">🕷️</div>
        <div class="lego-brick lego-red">🧱</div>
        <div class="lego-brick lego-yellow">🧱</div>
        
        <div class="f1-car mclaren-orange">🏎️</div>
        <div class="f1-car ferrari-red">🏎️</div>
        
        <div class="snoopy-icon">🐶</div>
        <div class="mj-silhouette">🎩</div>
        
        <div class="before-trilogy">🎬</div>
        
        <!-- Su animal favorito: Tortuga -->
        <div class="turtle-icon">🐢</div>

        <!-- SOBRE DE LA CARTA -->
        <div id="envelope" class="envelope">

            <div class="wax-seal">
                S
            </div>

            <div class="letter">

                <div class="paper">

                    <h1>Para Salomé</h1>

                    <p class="date">
                        10 de agosto
                    </p>

                    <div id="preview">
                        Toca el sobre para abrir la carta.
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
